name: Automated API Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: todolist_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Prisma migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:mysecretpassword@localhost:5432/todolist_db?schema=public"
        run: npx prisma migrate deploy

      - name: Start backend server
        working-directory: ./backend
        env:
          PORT: 3000
          DATABASE_URL: "postgresql://postgres:mysecretpassword@localhost:5432/todolist_db?schema=public"
        run: |
          npm run build
          npm start &
          timeout 30 bash -c 'until curl -s http://localhost:3000/todos > /dev/null; do sleep 1; done'

      - name: Install Apidog CLI
        run: npm install -g apidog-cli

      - name: Running Test Scenario
        run: apidog run --access-token "adgp_1d7fffqMwyvGREQ1OrKxuQrrPfgLWkXC20g9" -t 1952171 -e 6875718 -n 5 --delay-request 100 -r html,cli --branch 1408011 --on-error continue
