services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pevn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: todolist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend (Express + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pevn_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/todolist_db
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres

  # 3. Frontend (Vue.js + Vite)
  # (Bật service này khi bạn đã khởi tạo thư mục ./frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pevn_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

